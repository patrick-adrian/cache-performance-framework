[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheperf"
version = "0.1.0"
description = "Configurable cache performance-testing framework"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cacheperf = "cacheperf.sweep:main"
cacheperf-report = "cacheperf.report:main"

[tool.setuptools]
package-dir = { "" = "py" }

[tool.setuptools.packages.find]
where = ["py"]
include = ["cacheperf*"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]
pythonpath = ["py"]
addopts = "-q"
markers = [
    "rtl: builds and runs the SystemVerilog model; needs verilator on PATH",
]
